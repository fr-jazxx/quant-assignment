# Universe Configuration
# NIFTY 100 constituent symbols (NSE tickers with .NS suffix for yfinance)
# Source: NSE India NIFTY 100 factsheet (as of December 2023)
# Limitation: This is a static snapshot — point-in-time constituents are NOT available
# via public data. Survivorship bias is acknowledged and documented in the research report.

universe:
  name: "NIFTY100_STATIC_2023"
  description: "Static NIFTY 100 constituent list as of Dec 2023 (survivorship-biased)"
  exchange: "NSE"
  currency: "INR"
  data_source: "yfinance"
  suffix: ".NS"   # yfinance NSE suffix

  # Benchmark index
  benchmark: "^NSEI"   # NIFTY 50 index on yfinance

  # Historical date range
  # Note: We fetch from 2014-07-01 to give lookback signals enough warm-up data
  # before the training period begins on 2015-01-01.
  start_date: "2014-07-01"   # Extra 6 months for signal warm-up (252-day lookback)
  end_date: "2020-12-31"

  # Training / validation / out-of-sample split
  # OOS period covers 2020 — includes the COVID crash (Mar 2020) and recovery,
  # which is the most challenging stress test for any equity strategy.
  train_end: "2017-12-31"       # 3 years training
  validation_end: "2019-12-31"  # 2 years validation
  oos_start: "2020-01-01"       # 1 year OOS (COVID year — real stress test)

  # Minimum data availability (trading days) before a stock is included
  min_trading_days: 252   # ~1 year

  symbols:
    - "RELIANCE.NS"
    - "TCS.NS"
